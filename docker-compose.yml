# Full local pipeline: Kafka (KRaft, single node) + simulator + scorer + explainer + API.
#
#   docker compose up --build
#   curl "http://localhost:8000/alerts?limit=5"
#
# Scale the scorer to watch partitions rebalance and state restore from the compacted topic:
#   docker compose up --build --scale scorer=2

services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  scorer:
    build: .
    command: ["python", "-m", "fraud_explainer", "scorer"]
    environment: &app-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      kafka:
        condition: service_healthy

  explainer:
    build: .
    command: ["python", "-m", "fraud_explainer", "explainer"]
    environment: *app-env
    ports:
      - "${EXPLAINER_METRICS_PORT:-8002}:8002"
    depends_on:
      kafka:
        condition: service_healthy

  api:
    build: .
    command: ["python", "-m", "fraud_explainer", "api"]
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      kafka:
        condition: service_healthy

  simulator:
    build: .
    command: ["python", "-m", "fraud_explainer", "simulate", "--events", "5000", "--rate", "100",
              "--malformed-every", "1000"]
    environment: *app-env
    depends_on:
      kafka:
        condition: service_healthy
      scorer:
        condition: service_started
    restart: "no"
