name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      kafka:
        # The image's default config is a single-node KRaft broker advertising localhost:9092.
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
    env:
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      REQUIRE_KAFKA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[llm,dev]"
      - name: Wait for Kafka
        run: |
          for i in $(seq 1 30); do
            python -c "import socket; socket.create_connection(('localhost', 9092), 2)" && exit 0
            sleep 2
          done
          exit 1
      - name: Unit and Kafka integration tests
        run: pytest -v
      - name: Detection eval (simulated traffic)
        run: python -m eval.detection --events 10000
